name: Publicar carrusel

on:
  schedule:
    - cron: "0 9 * * 2,5"      # martes y viernes, 09:00 UTC
  workflow_dispatch:
    inputs:
      folder:
        description: "Carpeta del carrusel (ej. output/qing)"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Elegir el carrusel más antiguo sin publicar
        id: pick
        run: |
          FOLDER="${{ github.event.inputs.folder }}"
          if [ -z "$FOLDER" ]; then
            FOLDER=$(for d in output/*/; do
              [ -f "$d/.published.json" ] || { echo "$d"; break; }
            done)
          fi
          [ -n "$FOLDER" ] || { echo "Nada pendiente"; exit 0; }
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: Publicar
        if: steps.pick.outputs.folder != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: draft
        run: python publish.py "${{ steps.pick.outputs.folder }}"

      - name: Guardar el estado de publicación
        if: steps.pick.outputs.folder != ''
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add output/*/.published.json || true
          git diff --staged --quiet || git commit -m "publicado ${{ steps.pick.outputs.folder }}"
          git push
